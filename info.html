<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="jscript/logicajs"></script>
    <title>Contacto - Roshi 3D</title>
</head>
<body>
    <div class="pagina-entera">
        <header class="header-container">
            <div class="logo-caja">
                <a href="index.html">
                    <img src="assets/imagenesSitio/logo/logo-roshi.jpg" alt="Latienda3d" title="Latienda3d" class="logo-imagen">
                </a>
            </div>
            
            <div class="naveg-caja">
                <nav id="naveg" aria-label="Navegación principal">
                    <ul class="nav">
                        <li><a href="index.html">INICIO</a></li>
                        <li><a href="galeria.html">GALERIA</a></li>
                        <li><a href="info.html">INFO</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="formulario">
            <form name="campos" id="campos" class="form">
                <label for="nombre" class="form-label">Nombre: </label>
                <input type="text" name="name" class="form-input" placeholder="Ingrese su nombre aqui" id="nombre" required>

                <label for="apellido" class="form-label">Apellido: </label>
                <input type="text" name="surname" class="form-input" placeholder="Ingrese su apellido aqui" id="apellido" required>

                <label for="telefono" class="form-label">Telefono: </label>
                <input type="tel" name="tel" class="form-input" placeholder="Ingrese su telefono aqui" id="telefono" required>

                <label for="email" class="form-label">Email: </label>
                <input type="email" name="correo" class="form-input" placeholder="Ingrese su correo electronico aqui" id="email" required>

                <label for="areaTexto" class="form-label">Comentarios: </label>
                <textarea name="areaTexto" class="form-textarea" placeholder="Escriba su comentario o inquietud aqui" id="areaTexto"></textarea> 

                <div class="form-botones">
                    <input type="submit" class="button-submit" name="enviar" value="Enviar">
                    <input type="button" class="button-limpiar" value="Limpiar" onclick="reseteando()">
                </div>

                <p class="form-mensaje">Gracias por escribirnos, nos comunicaremos a la brevedad.</p>
            </form>
        </div>

        <footer>
            <div class="footer-contenido">
                <div>© 2026 Roshi3D inc. Todos los derechos reservados.</div>
            </div>
        </footer>
    </div>
</body>
</html>
